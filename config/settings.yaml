# All tunable values for quantdesk. No secrets here: those live in .env.
timezone: Asia/Kolkata
session:
  open: "09:15"
  close: "15:30"
  minutes: 375
  # From 3 Aug 2026 index values are not computed during the closing auction: Nifty 1-minute
  # candles stop at 15:14 and one 15:29 bar carries the close (live candles, 19 Oct 2026).
  closing_auction: {start: "15:15", since: "2026-08-03"}
paths: {data_dir: data}

angel:
  # getCandleData limits from the SmartAPI RateLimit page (21 Oct 2026), counted per client code across all
  # our processes; ltpData allows more (10/s, 500/min). (calls, seconds); limiter uses calls-1 per window.
  rate_limits: [[3, 1.0], [120, 60.0], [5000, 3600.0]]
  candle_max_days: {ONE_MINUTE: 30, THREE_MINUTE: 60, FIVE_MINUTE: 100, TEN_MINUTE: 100,
                    FIFTEEN_MINUTE: 200, THIRTY_MINUTE: 200, ONE_HOUR: 400, ONE_DAY: 2000}
  relogin_time: "08:45"
  instrument_master_url: https://margincalculator.angelbroking.com/OpenAPI_File/files/OpenAPIScripMaster.json
  index_tokens:
    NIFTY: {exchange: NSE, token: "99926000", symbol: "Nifty 50"}
    SENSEX: {exchange: BSE, token: "99919000", symbol: "SENSEX"}
    INDIAVIX: {exchange: NSE, token: "99926017", symbol: "India VIX"}

recorder:
  strike_width: 15
  fallback_width: 10
  recenter_strikes: 5
  depth_width: 3
  prestart: "09:10"            # log in and subscribe before the open so the first ticks are kept
  opening_ticks: ["09:15", "09:30"]
  stale_seconds: 30
  max_tokens_per_connection: 1000

backfill: {minute_start: "2019-01-01", daily_start: "2015-01-01"}

urls:
  nse_home: https://www.nseindia.com
  nse_fo_bhavcopy: https://nsearchives.nseindia.com/content/fo/BhavCopy_NSE_FO_0_0_0_{yyyymmdd}_F_0000.csv.zip
  bse_fo_bhavcopy: https://www.bseindia.com/download/Bhavcopy/Derivative/BhavCopy_BSE_FO_0_0_0_{yyyymmdd}_F_0000.CSV
  # NSE F&O days before 8 Jul 2024 exist only in the old layout (checked live 21 Oct 2026)
  nse_fo_bhavcopy_legacy: https://nsearchives.nseindia.com/content/historical/DERIVATIVES/{yyyy}/{mon}/fo{dd}{mon}{yyyy}bhav.csv.zip
  nse_participant_oi: https://nsearchives.nseindia.com/content/nsccl/fao_participant_oi_{ddmmyyyy}.csv
  nse_fii_dii: https://www.nseindia.com/api/fiidiiTradeReact
  nse_nifty50_list: https://nsearchives.nseindia.com/content/indices/ind_nifty50list.csv

macro:
  daily_times: ["07:30", "18:30"]
  daily_lookback_days: 10
  intraday_every_minutes: 5
  intraday_window: ["09:00", "15:30"]
  intraday_tickers: ["ES=F", "NQ=F", "INR=X", "BZ=F", "^N225", "^HSI"]
  fred_sources: [openbb_fred, openbb_fred_brent]
  series:
    - {id: brent, source: yfinance, symbol: "BZ=F"}
    - {id: usdinr, source: yfinance, symbol: "INR=X"}
    - {id: dxy, source: yfinance, symbol: "DX-Y.NYB"}
    - {id: es, source: yfinance, symbol: "ES=F"}
    - {id: nq, source: yfinance, symbol: "NQ=F"}
    - {id: spx, source: yfinance, symbol: "^GSPC"}
    - {id: n225, source: yfinance, symbol: "^N225"}
    - {id: hsi, source: yfinance, symbol: "^HSI"}
    - {id: kospi, source: yfinance, symbol: "^KS11"}
    - {id: nifty_yf, source: yfinance, symbol: "^NSEI"}
    - {id: sensex_yf, source: yfinance, symbol: "^BSESN"}
    - {id: banknifty_yf, source: yfinance, symbol: "^NSEBANK"}
    - {id: indiavix_yf, source: yfinance, symbol: "^INDIAVIX"}
    - {id: us10y, source: openbb_federal_reserve_treasury, field: year_10}
    - {id: dgs10, source: openbb_fred, symbol: DGS10}
    - {id: dexinus, source: openbb_fred, symbol: DEXINUS}
    - {id: brent_fred, source: openbb_fred_brent}
    - {id: india_cpi_oecd, source: openbb_oecd_cpi, country: india, lookback_days: 400}
    - {id: india_gdp_oecd, source: openbb_oecd_gdp_real, country: india, lookback_days: 800}
    - {id: india_rates_oecd, source: openbb_oecd_rates, country: india, lookback_days: 400}
    - {id: india_cpi_imf, source: openbb_imf_cpi, country: IND, lookback_days: 400}
    - {id: econ_calendar, source: openbb_nasdaq_calendar}
    # 10-year benchmark G-Sec clean-price index from the same NSE file. FBIL's par yield is not used: its terms
    # require a paid subscription for back-testing and risk use (checked 21 Oct 2026). The SP2 macro engine turns
    # price changes into approximate yield changes (dy ~ -dP/P / modified duration).
    - {id: india_gsec10y_price, source: nse_index_close, lookback_days: 7,
       url: "https://nsearchives.nseindia.com/content/indices/ind_close_all_{ddmmyyyy}.csv",
       indices: ["Nifty 10 yr Benchmark G-Sec (Clean Price)"]}
    # NSE's daily index file (public): Nifty 50 P/E, P/B, dividend yield (named "CNX Nifty" before Nov 2015)
    - {id: nifty_fundamentals, source: nse_index_close, fields: fundamentals, lookback_days: 7,
       url: "https://nsearchives.nseindia.com/content/indices/ind_close_all_{ddmmyyyy}.csv", indices: ["Nifty 50", "CNX Nifty"]}
eod: {retry_until: "23:00", min_request_interval_s: 1.5}
