# Scheduled market events 2019-2026 for the backtest's event gate (R9, spec §6.1 step 1). Read with
# quantdesk.calendar.events.load_events, like config/events.yaml (which keeps the live calendar).
#
# Only events that fall inside Indian market hours matter intraday:
#   - RBI MPC decisions (E2): no entries until event.rbi_wait_min after `time`
#   - Union Budget speeches (E2): no entries before event.budget_no_entry_before, then Delta +0.04
#   - general-election results (E3): no trade
#   - Nifty 50 rebalance days (E1): flat by 15:00 (the last session before a membership change takes effect)
# US releases and Indian data come after the close and are left out.
#
# RBI decision times:
#   - 11:45 for 2019 to Feb 2020 (RBI's own notices)
#   - 10:00 from 2023 (RBI practice, reported each meeting)
#   - 12:00, the conservative choice, for Aug 2020 to Dec 2022 where no notice was found: `time_assumed: true`
# A later assumed time only blocks entries longer.
#
# Off-cycle RBI moves (27 Mar 2020, 22 May 2020, 4 May 2022) were not known beforehand:
# `scheduled: false`, so the calendar gate ignores them; they belong to the shock and headline paths.

