  gate.room_in_time_range_factor: {value: 1.6, source: "R23; ITR:284 (expected remaining range about 1.6 sigma_rem)", provenance: research_value}
  gate.room_in_time_multiplier: {value: 2.0, source: "spec §6.1 step 4.3", provenance: spec}
  gate.round_step_nifty: {value: 100, source: "spec §6.1 step 4.4", provenance: spec}
  gate.round_step_sensex: {value: 500, source: "R24: comparable % spacing to Nifty's 100s", provenance: design_ruling}
  gate.multi_touch_tolerance: {value: 0.0005, source: "R24", provenance: design_ruling}
  gate.multi_touch_min_touches: {value: 2, source: "R24", provenance: design_ruling}
  gate.multi_touch_min_gap_min: {value: 3, source: "R24", provenance: design_ruling}
  gate.vol_rich_percentile: {value: 0.80, source: "R22", provenance: design_ruling}
  gate.vol_rich_window_days: {value: 252, source: "R22", provenance: design_ruling}
