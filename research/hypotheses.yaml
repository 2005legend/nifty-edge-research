# SP2 pre-registration (spec §6.3, §6.4). Every number the strategy, the backtester and the validation use,
# fixed before any P&L outcome is seen. Code reads values through quantdesk.validation.hypotheses.param.
#
# provenance:
#   spec                    - stated in the design spec
#   research_value          - taken from reports/ or research_notes/ (reference given)
#   design_ruling           - fixed in the SP2 design pass (21 Oct 2026) under the owner's delegation
#   after_full_sample_look  - chosen after looking at full-sample outcomes (see research/prior_looks.md);
#                             these count in the deflated-Sharpe trial number, and a regime add-on built on
#                             them must also pass the clean forward holdout before it goes live (R33)
#   owner                   - the owner's own decision
# The trial registry refuses runs once this file's hash differs from the one tagged prereg-v1 (M7).

version: 1
frozen: false   # set to true at the prereg-v1 tag (M8)

parameters:
  # --- account and risk (spec §2) ---
  account.capital: {value: 10000, source: "spec §2", provenance: owner}
  account.risk_rupees: {value: 400, source: "spec §2", provenance: owner}
  account.premium_budget: {value: 9500, source: "spec §6.1 step 7", provenance: spec}
  account.fixed_cost_buffer: {value: 60, source: "spec §6.1 step 7 (premium x lot + 60 <= 9500)", provenance: spec}
  account.capital_floor: {value: 7000, source: "spec §2", provenance: owner}
  caps.per_day: {value: 1, source: "spec §2", provenance: owner}
  caps.per_week: {value: 3, source: "spec §2", provenance: owner}
  caps.per_year: {value: 100, source: "spec §2 (D3)", provenance: owner}
  caps.month_rule: {value: "ceil(per_year * trading_days_in_month / trading_days_in_year)", source: "R31", provenance: design_ruling}
  caps.loss_day: {value: 400, source: "spec §2; reported as an as-lived overlay, not in gate statistics (R31)", provenance: owner}
  caps.loss_week: {value: 1000, source: "spec §2; overlay (R31)", provenance: owner}

  # --- timeline (spec §6.1 step 2) ---
  time.first_check: {value: "09:45", source: "spec §6.1 step 2", provenance: spec}
  time.check_minutes: {value: [0, 15, 30, 45], source: "spec §6.1 step 2", provenance: spec}
  time.last_entry: {value: "14:00", source: "spec §6.1 step 2", provenance: spec}
  time.last_entry_expiry: {value: "13:30", source: "spec §6.1 step 2", provenance: spec}
  time.spot_cutoff: {value: "15:15", source: "spec §6.1 step 2 (no spot prints after 15:15)", provenance: spec}
  time.hard_exit: {value: "15:10", source: "spec §6.1 step 8; same time before and after the auction (rulings)", provenance: spec}
  time.hard_exit_expiry: {value: "15:00", source: "spec §6.1 step 8", provenance: spec}
  time.daycard_evening: {value: "09:05", source: "R5", provenance: design_ruling}
  time.daycard_gap: {value: "09:16", source: "R5: gap-dependent inputs (HAR-IV-ON) only after the open", provenance: design_ruling}
  time.alert_lapse_min: {value: 5, source: "spec §6.1 step 8", provenance: spec}

  # --- H1 trigger (spec §6.1 step 3) ---
