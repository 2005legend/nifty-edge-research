  gate.breadth_top_n: {value: 5, source: "spec §5A.1 (top-5 heavyweights), ranked by prior-day traded value (R5)", provenance: spec}
  gate.spike_multiple: {value: 4.0, source: "R21: modelled ATM premium 1-min change vs median at that minute over the prior 14 sessions", provenance: design_ruling}
  gate.spike_window_min: {value: 5, source: "spec §6.1 step 4.7", provenance: spec}
  gate.spike_lookback_days: {value: 14, source: "R21", provenance: design_ruling}

  # --- events (spec §6.1 step 1, §5A.2) ---
  event.rbi_wait_min: {value: 45, source: "R27 (upper end of the spec's 30-45)", provenance: design_ruling}
  event.headline_window_min: {value: 30, source: "R27; live only (R30)", provenance: design_ruling}
  event.exit_before_min: {value: 5, source: "spec §6.1 step 8", provenance: spec}
