gates:
  event_shock:
    rule: "no entry on E3 days, within event.rbi_wait_min after an RBI decision, or when intraday VIX moved more than gate.intraday_vix_band from the prior close; headline window is live only"
    parameters: [event.rbi_wait_min, gate.intraday_vix_band, event.headline_window_min]
    source: "spec §6.1 step 4.1; R27, R30"
  stop_fit:
    rule: "b = stop.structural; reject if b > stop.max_daily_move_fraction x VIX-implied daily move; loss at stop x stop.overshoot_factor + stop exit spreads <= account.risk_rupees; planning target >= stop.planning_target_multiple x b; re-checked at the fill"
    parameters: [stop.structural, stop.max_daily_move_fraction, stop.overshoot_factor, account.risk_rupees, stop.planning_target_multiple, stop.stop_exit_half_spreads]
    source: "spec §6.1 step 4.2; R19"
  room_in_time:
    rule: "gate.room_in_time_range_factor x sigma_rem >= gate.room_in_time_multiplier x (target distance + theta drag to the deadline, in index points)"
    parameters: [gate.room_in_time_range_factor, gate.room_in_time_multiplier]
    source: "spec §6.1 step 4.3; R23"
  room_to_run:
    rule: "no opposing level before the target: round numbers, prior-day and prior-week H/L/C, multi-touch session extremes"
    parameters: [gate.round_step_nifty, gate.round_step_sensex, gate.multi_touch_tolerance, gate.multi_touch_min_touches, gate.multi_touch_min_gap_min]
    source: "spec §6.1 step 4.4; R24"
  volatility:
    rule: "implied remaining-session move / HAR remaining move <= its trailing percentile"
    parameters: [gate.vol_rich_percentile, gate.vol_rich_window_days]
    source: "spec §6.1 step 4.5; R22"
  confirmation:
    rule: "at least gate.breadth_agree_min of 3 breadth signals agree with the side; OFI is live shadow only"
    parameters: [gate.breadth_agree_min, gate.breadth_top_n]
    source: "spec §6.1 step 4.6; R20"
  spike_guard:
    rule: "no entry within gate.spike_window_min of a modelled ATM premium 1-minute change above gate.spike_multiple x its median at that minute over the prior gate.spike_lookback_days sessions"
    parameters: [gate.spike_window_min, gate.spike_multiple, gate.spike_lookback_days]
    source: "spec §6.1 step 4.7; R21"
  ev:
    rule: "p >= breakeven + ev.margin + Delta (Delta <= ev.delta_cap); EV >= ev.min_r R and >= ev.min_rupees; Kelly f* = p - (1-p) L/G >= L / capital"
    parameters: [ev.margin, ev.delta_cap, ev.min_r, ev.min_rupees, ev.breakeven, account.capital]
    source: "spec §6.1 step 6; R29"
  validation_pass:
    rule: "all of: median trades per CPCV test pair >= gate.min_trades_per_fold; median-path t >= gate.t_min; walk-forward mean net R > 0; positive in >= gate.years_positive_min of gate.years; DSR >= gate.dsr_min with N = gate.n_prior + trials run; PBO <= gate.pbo_max; permutation p < gate.permutation_p; gate.delay_test; post-publication ratio >= gate.post_publication_ratio"
    parameters: [gate.min_trades_per_fold, gate.t_min, gate.years, gate.years_positive_min, gate.dsr_min, gate.n_prior, gate.pbo_max, gate.pbo_splits, gate.permutation_p, gate.permutation_buckets, gate.permutation_rounds, gate.delay_test, gate.post_publication_date, gate.post_publication_ratio, cv.embargo_days]
    source: "spec §6.3; R34"
  regime_addon:
    rule: "also: per-available-day net P&L not lower than the predecessor; per-trade expectancy gain with t >= gate.addon_t_min; better in >= gate.addon_years_better_min of gate.years; parameters marked after_full_sample_look must pass the clean forward holdout before going live"
    parameters: [gate.addon_t_min, gate.addon_years_better_min, gate.years, holdout.setups]
    source: "spec §6.3; R33"

registry:
  - {id: B0, slot: 1, config: "H1, a priori timing and orders, X0 exits, flat breakeven + 0.04, Platt-calibrated equal-weight family consensus", run_if: always}
  - {id: X1, slot: 2, config: "B0 with E-trail exits (R2 execution model)", run_if: always}
  - {id: M1, slot: 3, config: "exit winner + ridge logistic meta-model (meta.columns)", run_if: always}
  - {id: RV-2, slot: 4, config: "M1 + shock hurdle", run_if: always}
  - {id: RV-1, slot: 5, config: "+ stress-score hurdle at full tiers", run_if: always}
  - {id: RV-3, slot: 6, config: "+ slow-trend hurdle (jump model)", run_if: "H1 passes on B0 or X1 and >= 4 slots remain"}
  - {id: RV-4, slot: 7, config: "+ gamma hurdle", run_if: "the gamma engine passes P3"}
  - {id: ROD, slot: 8, config: "14:45 rest-of-day momentum, one pre-fixed gamma sign, research only", run_if: "the gamma engine passes P3"}
  - {id: RV-5, slot: 9, config: "RV-2 + RV-3 + RV-4 combined, Delta <= 0.08", run_if: "at least two of them are accepted"}
  - {id: CTX, slot: 10, config: "one reversal-context feature (3-5 day stretch in HAR units) added to M1", run_if: "P4 MAC(5) significantly negative after 2015 and >= 3 slots remain"}
  - {id: X2, slot: 11, config: "VWAP-runner exit", run_if: "the owner opts in (R3)"}
  - {id: RES-1, slot: 12, config: "reserve: forced re-run", run_if: "a forced re-run, e.g. after a failed pricing check"}
  - {id: RES-2, slot: 13, config: "reserve: forced re-run", run_if: "a forced re-run"}

pilots:
  - {id: P1, measures: "trigger, stop-fit and strike-picker pass rates by VIX tercile, lot-size era and before/after 20 Nov 2024", decides: "D2 checkpoint inputs", costs_trial: false}
  - {id: P2, measures: "MFE/MAE paths and time to MFE of setups, 2019-22 only", decides: "D1 reversal clause (peak within about 30 min then revert)", costs_trial: false}
  - {id: P3, measures: "gamma engine (prior-day OI) vs rest-of-day range and slope", decides: "whether RV-4 and ROD run", costs_trial: false}
  - {id: P4, measures: "Nifty daily AR(1) and MAC(5), 2014-2026", decides: "whether CTX runs", costs_trial: false}
  - {id: P5, measures: "OI walls and max pain vs settlement", decides: "display only", costs_trial: false}
  - {id: P6, measures: "option depth and alert latency from recordings", decides: "the live cost check and the SP3 spread table", costs_trial: false}
  - {id: P7, measures: "pretrained volatility models vs HAR (QLIKE, Diebold-Mariano)", decides: "the volatility forecaster; HAR stays if not finished by pre-flight (R37)", costs_trial: false}
  - {id: P8, measures: "headline tone classifiers vs owner labels", decides: "live headline veto (moved to SP3)", costs_trial: false}
  - {id: P9, measures: "VWAP proxy vs front-month futures VWAP: side disagreement and gap / median b", decides: "VWAP anchor (spec §6.0)", costs_trial: false}
  - {id: P10, measures: "power: probability that every gate passes under a 2-4 point uplift; minimum detectable effect", decides: "shown at the D2 checkpoint", costs_trial: false}
  - {id: CLOCK, measures: "business-time weights fit on 2019-22", decides: "the frozen clock (config/frozen/clock_v1.yaml)", costs_trial: false}
